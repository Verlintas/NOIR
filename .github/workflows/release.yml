name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        shell: bash
        run: ./gradlew :cli:installDist -PnoirVersion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cd cli/build/install
          zip -qr "$GITHUB_WORKSPACE/dist/noir-${GITHUB_REF_NAME}-${{ runner.os }}.zip" noir

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path cli/build/install/noir -DestinationPath "dist/noir-$env:GITHUB_REF_NAME-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: noir-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
