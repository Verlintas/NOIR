name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Linux
          - os: macos-latest
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x86_64
          - os: windows-latest
            artifact: Windows

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must look like v1.2.3" >&2
            exit 1
          fi

      - name: Build and test distribution
        shell: bash
        run: ./gradlew :core:jvmTest :cli:test :cli:installDist -PnoirVersion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Package app image (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          # jpackage rejects a leading zero in the bundle version. Keep the
          # release tag as-is; use a valid bundle version for 0.x releases.
          JPACKAGE_VERSION="$APP_VERSION"
          case "$APP_VERSION" in 0.*) JPACKAGE_VERSION="1.${APP_VERSION#0.}" ;; esac
          MAIN_JAR="$(basename "$(ls cli/build/install/noir/lib/cli-*.jar | head -1)")"
          mkdir -p stage release
          jpackage \
            --type app-image \
            --name NOIR \
            --input cli/build/install/noir/lib \
            --main-jar "$MAIN_JAR" \
            --main-class app.noir.cli.MainKt \
            --dest stage \
            --app-version "$JPACKAGE_VERSION" \
            --vendor Verlintas \
            --description "Android leak audit" \
            --java-options "-Dfile.encoding=UTF-8" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"
          cp LICENSE stage/LICENSE

          if [ "${{ runner.os }}" = "macOS" ]; then
            cat > "stage/Start NOIR.command" <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")" || exit 1
          ./NOIR.app/Contents/MacOS/NOIR "$@"
          echo
          read -n 1 -s -r -p "press any key to close"
          SH
            chmod +x "stage/Start NOIR.command"
            "stage/NOIR.app/Contents/MacOS/NOIR" --version
          else
            cat > "stage/Start-NOIR.sh" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          ./NOIR/bin/NOIR "$@"
          echo
          printf "press Enter to close"; read _
          SH
            chmod +x "stage/Start-NOIR.sh"
            "stage/NOIR/bin/NOIR" --version
          fi

          (cd stage && zip -qry "../release/noir-${GITHUB_REF_NAME}-${ARTIFACT}-portable.zip" .)

      - name: Package app image (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $ErrorActionPreference = "Stop"
          $appVersion = $env:GITHUB_REF_NAME.Substring(1)
          $jpkgVersion = if ($appVersion.StartsWith("0.")) { "1." + $appVersion.Substring(2) } else { $appVersion }
          $mainJar = (Get-ChildItem cli/build/install/noir/lib/cli-*.jar | Select-Object -First 1).Name
          New-Item -ItemType Directory -Force -Path stage, release | Out-Null
          jpackage `
            --type app-image `
            --name NOIR `
            --input cli/build/install/noir/lib `
            --main-jar $mainJar `
            --main-class app.noir.cli.MainKt `
            --dest stage `
            --app-version $jpkgVersion `
            --vendor Verlintas `
            --description "Android leak audit" `
            --win-console `
            --java-options "-Dfile.encoding=UTF-8" `
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"
          Copy-Item LICENSE stage\LICENSE
          @"
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          "NOIR\runtime\bin\java.exe" -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -cp "NOIR\app\*" app.noir.cli.MainKt %*
          echo.
          pause
          "@ | Set-Content -Encoding ASCII "stage\Start NOIR.bat"
          $v = & "stage\NOIR\NOIR.exe" --version
          if ($v -notmatch "NOIR") { throw "NOIR.exe did not run: [$v]" }
          Compress-Archive -Path stage\* -DestinationPath "release/noir-$env:GITHUB_REF_NAME-$env:ARTIFACT-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: noir-${{ matrix.artifact }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: checksums
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
