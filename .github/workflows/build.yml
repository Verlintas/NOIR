name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        shell: bash
        run: ./gradlew :cli:installDist --console=plain

      - name: Test
        shell: bash
        env:
          COLUMNS: 50
        run: ./gradlew :core:jvmTest :cli:test --console=plain

      - name: Smoke test
        shell: bash
        run: |
          ./cli/build/install/noir/bin/noir --version
          ./cli/build/install/noir/bin/noir --help >/dev/null

      - name: Package smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAR="$(basename "$(ls cli/build/install/noir/lib/cli-*.jar | head -1)")"
          mkdir -p stage
          jpackage \
            --type app-image \
            --name NOIR \
            --input cli/build/install/noir/lib \
            --main-jar "$MAIN_JAR" \
            --main-class app.noir.cli.MainKt \
            --dest stage \
            --app-version 1.0.0 \
            --vendor Verlintas \
            --description "Android leak audit" \
            --java-options "-Dfile.encoding=UTF-8" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"
          ./stage/NOIR/bin/NOIR --version

      - uses: actions/upload-artifact@v7
        with:
          name: noir-${{ runner.os }}
          path: cli/build/install/noir
          if-no-files-found: error

      # Basic caching tars Gradle User Home without stopping the daemon first;
      # on Windows the daemon's lock files then make the cache save fail.
      - name: Stop Gradle daemons
        if: always()
        shell: bash
        run: ./gradlew --stop || true

  docker:
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      # .dockerignore is an allowlist: a local scan report must not reach a layer.
      - name: Plant a report the build context must ignore
        shell: bash
        run: |
          mkdir -p noir-out
          echo "private scan data" > noir-out/report.json

      - name: Build image
        shell: bash
        run: docker build -t noir:ci .

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm noir:ci --version
          docker run --rm --entrypoint adb noir:ci version
          # No phone here, so doctor exits 1. It must still find the packaged
          # adb, notice the container and explain USB passthrough.
          docker run --rm -e NOIR_LANG=en noir:ci doctor | tee doctor.txt || true
          grep -q "container docker" doctor.txt
          grep -q "adb       /usr/bin/adb" doctor.txt
          grep -q "no device detected in the container" doctor.txt

      - name: Build context holds the allowlist only
        shell: bash
        run: |
          set -euo pipefail
          docker build --target build -t noir:ci-build .
          allowed='build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradle|core|cli|LICENSE|build|\.gradle|\.kotlin'
          extra="$(docker run --rm --entrypoint ls noir:ci-build -A /src | grep -vxE "$allowed" || true)"
          if [ -n "$extra" ]; then
            echo "unexpected files in the build context:"
            echo "$extra"
            exit 1
          fi
