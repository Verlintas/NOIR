name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        run: ./gradlew :cli:installDist --console=plain

      - name: Test
        shell: bash
        env:
          COLUMNS: 50
        run: ./gradlew :core:jvmTest :cli:test --console=plain

      - name: Smoke test
        shell: bash
        run: |
          ./cli/build/install/noir/bin/noir --version
          ./cli/build/install/noir/bin/noir --help >/dev/null

      - name: Package smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAR="$(basename "$(ls cli/build/install/noir/lib/cli-*.jar | head -1)")"
          mkdir -p stage
          jpackage \
            --type app-image \
            --name NOIR \
            --input cli/build/install/noir/lib \
            --main-jar "$MAIN_JAR" \
            --main-class app.noir.cli.MainKt \
            --dest stage \
            --app-version 1.0.0 \
            --vendor Verlintas \
            --description "Android leak audit" \
            --java-options "-Dfile.encoding=UTF-8" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"
          ./stage/NOIR/bin/NOIR --version

      - uses: actions/upload-artifact@v7
        with:
          name: noir-${{ runner.os }}
          path: cli/build/install/noir
          if-no-files-found: error
